<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clear Night | Stargazing forecast</title>
  <meta name="description" content="How good will tonight be for stargazing? A forecast of observing conditions for any place.">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="ruler" aria-hidden="true"></div>

  <header class="top">
    <a class="logo" href="./">Clear&nbsp;Night</a>
    <form class="search" id="search-form" role="search">
      <label class="visually-hidden" for="search-input">Search place</label>
      <input id="search-input" name="q" type="search" placeholder="Search place" autocomplete="off" required>
      <button type="submit">Search</button>
      <ul class="search__results" id="search-results" hidden></ul>
    </form>
  </header>

  <div class="corners">
    <span id="place-name">No place selected</span>
    <span id="place-coords"></span>
  </div>

  <main class="stage">
    <section class="score" aria-live="polite">
      <p class="label" id="status">Search for a place to see tonight's sky</p>
      <p class="score__num" id="score">--</p>
      <p class="score__verdict" id="verdict"></p>
    </section>
  </main>

  <section class="instrument" aria-label="Hour by hour">
    <div class="timeline" id="timeline"></div>
    <dl class="readout" id="readout"></dl>
  </section>

  <footer class="bottom">
    <span class="live">Local time <b id="clock">--:--</b></span>
    <span>Data: <a href="https://open-meteo.com/">Open-Meteo</a></span>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/score.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
